<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101719">
  <title>Foglight — The Moonstone Job</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #101719; color: #d9ded1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #22302e 0%, #151e20 49%, #0d1315 100%); overflow: hidden; }
    main { width: min(100vw, 1280px); padding: 16px 30px 14px; }
    .top { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
    .brand { display:flex; gap:12px; align-items:center; letter-spacing:.19em; font-size:12px; color:#9eaa9f; text-transform:uppercase; }
    .sigil { color:#e8c981; font-size:23px; line-height:1; text-shadow:0 0 16px #d5a64c88; }
    .top small { color:#73827d; letter-spacing:.14em; font-size:10px; text-transform:uppercase; }
    .frame { border:1px solid #56645b; padding:7px; background:#11191a; box-shadow:0 22px 70px #0009, inset 0 0 0 1px #202a28; position:relative; }
    .frame:before,.frame:after { content:''; position:absolute; width:13px; height:13px; border-color:#c6a562; border-style:solid; z-index:2; pointer-events:none; }
    .frame:before { top:2px; left:2px; border-width:1px 0 0 1px; } .frame:after { right:2px; bottom:2px; border-width:0 1px 1px 0; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:1000/560; background:#151d1c; image-rendering: auto; }
    .bottom { height:42px; display:flex; align-items:end; justify-content:space-between; padding:0 4px; color:#7e8d85; font-size:10px; letter-spacing:.09em; text-transform:uppercase; }
    .keys { display:flex; gap:17px; } .keys b { color:#d0bd8b; font-weight:500; }
    #toast { position:fixed; left:50%; top:18%; transform:translate(-50%,-8px); opacity:0; pointer-events:none; background:#17211fdd; border:1px solid #b89455; color:#f0d89d; padding:10px 17px; letter-spacing:.12em; font-size:12px; transition:opacity .2s,transform .2s; z-index:5; }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:700px) { main{padding:8px} .top{height:38px}.top small{display:none}.bottom{font-size:8px}.keys{gap:7px} }
  </style>
</head>
<body>
  <main>
    <header class="top"><div class="brand"><span class="sigil">✦</span><span>Foglight <span style="color:#596761">/</span> The Moonstone Job</span></div><small>Field notes · No. 03</small></header>
    <div class="frame"><canvas id="game" width="1000" height="560" aria-label="Foglight stealth game"></canvas></div>
    <footer class="bottom"><span>Night operation <b style="color:#bca66f">·</b> 22:48</span><span class="keys"><span><b>WASD</b> move</span><span><b>SHIFT</b> sneak</span><span><b>CLICK</b> pebble</span><span><b>ESC</b> pause</span></span></footer>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
